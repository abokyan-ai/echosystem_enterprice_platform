name: Static architecture checks (tests deferred)
on:
  push:
  pull_request:
# User policy: comprehensive/runtime test execution is deferred.
# Re-enable only after an explicit future execution instruction.
env:
  DEFER_COMPREHENSIVE_TESTS: "true"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/dev.py install
      - name: Enforce dependency governance
        run: python scripts/dev.py fitness:json --output build/architecture-fitness.json
      - run: python scripts/dev.py dependencies:json
      - run: python scripts/dev.py lint
      - run: python scripts/dev.py build
      - if: env.DEFER_COMPREHENSIVE_TESTS != 'true'
        run: python scripts/dev.py test
      - if: env.DEFER_COMPREHENSIVE_TESTS != 'true'
        run: python scripts/dev.py test:architecture
      - if: env.DEFER_COMPREHENSIVE_TESTS != 'true'
        run: python scripts/dev.py cli --help
      - if: env.DEFER_COMPREHENSIVE_TESTS != 'true'
        run: python scripts/dev.py cli --version
      - if: env.DEFER_COMPREHENSIVE_TESTS != 'true'
        run: python scripts/dev.py modules --output json
      - if: env.DEFER_COMPREHENSIVE_TESTS != 'true'
        run: python scripts/dev.py health --output json
      - if: env.DEFER_COMPREHENSIVE_TESTS != 'true'
        run: python scripts/dev.py doctor --output json
      - if: env.DEFER_COMPREHENSIVE_TESTS != 'true'
        run: python scripts/dev.py run --once
      - if: env.DEFER_COMPREHENSIVE_TESTS != 'true'
        run: python scripts/dev.py run --once --config config/test.json
      - name: Report deferred verification status
        if: env.DEFER_COMPREHENSIVE_TESTS == 'true'
        run: |
          echo 'Testing status: DEFERRED / NOT VERIFIED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Deferred-suite tests executed: 0. Static checks do not verify semantic behavior.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload architecture fitness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-fitness-python-${{ matrix.python }}
          path: build/architecture-fitness.json
          if-no-files-found: error
